<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd" />
      <stop offset="50%" stop-color="#c77dff" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Filters & Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pulse-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1" />
      <circle cx="40" cy="0" r="1.5" fill="rgba(56, 189, 248, 0.15)" />
      <circle cx="0" cy="40" r="1.5" fill="rgba(56, 189, 248, 0.15)" />
    </pattern>
  </defs>

  <style>
    .grid-bg { opacity: 0.9; }
    .pulse-orb {
      animation: pulseAnim 4s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8 12;
      animation: dashFlow 20s linear infinite;
    }
    .flow-reverse {
      stroke-dasharray: 6 10;
      animation: dashFlowRev 25s linear infinite;
    }
    .scan-radar {
      transform-origin: 1050px 210px;
      animation: radarRotate 8s linear infinite;
    }
    .data-particle {
      animation: floatNode 6s ease-in-out infinite alternate;
    }
    .p-delay-1 { animation-delay: 1.2s; }
    .p-delay-2 { animation-delay: 2.5s; }
    .p-delay-3 { animation-delay: 3.8s; }

    @keyframes pulseAnim {
      0% { transform: scale(0.95); opacity: 0.3; }
      100% { transform: scale(1.1); opacity: 0.65; }
    }
    @keyframes dashFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -500; }
    }
    @keyframes dashFlowRev {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 500; }
    }
    @keyframes radarRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes floatNode {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-12px) scale(1.08); }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="420" rx="16" fill="url(#cyber-grid)" class="grid-bg" />

  <!-- Dynamic Ambient Orbs (Background) -->
  <g opacity="0.45">
    <circle cx="150" cy="80" r="140" fill="#38bdf8" filter="url(#pulse-glow)" class="pulse-orb" />
    <circle cx="1060" cy="210" r="160" fill="#a855f7" filter="url(#pulse-glow)" class="pulse-orb p-delay-2" />
    <circle cx="600" cy="380" r="130" fill="#06b6d4" filter="url(#pulse-glow)" class="pulse-orb p-delay-1" />
  </g>

  <!-- Dynamic Flow Lines & Cyber Connections (Background) -->
  <g fill="none" opacity="0.35">
    <path class="flow-line" d="M -50 120 C 300 40, 700 240, 1250 150" stroke="#00f2fe" stroke-width="2" />
    <path class="flow-reverse" d="M -50 300 C 400 380, 850 160, 1250 280" stroke="#c084fc" stroke-width="1.8" />
    <path class="flow-line" d="M 200 430 C 500 260, 800 390, 1100 -20" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Radar / Threat Scanner Display (Background Right) -->
  <g opacity="0.5">
    <circle cx="1050" cy="210" r="130" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
    <circle cx="1050" cy="210" r="90" fill="none" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1" stroke-dasharray="4 6" />
    <circle cx="1050" cy="210" r="50" fill="none" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" />
    <circle cx="1050" cy="210" r="4" fill="#00f2fe" filter="url(#glow)" />
    <!-- Rotating beam -->
    <g class="scan-radar">
      <path d="M 1050 210 L 1180 210 A 130 130 0 0 0 1142 118 Z" fill="url(#shield-grad)" opacity="0.7" />
      <line x1="1050" y1="210" x2="1180" y2="210" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
    </g>
  </g>

  <!-- Floating Data Nodes / Hex Orbs (Midground) -->
  <g class="data-particle" opacity="0.75">
    <polygon points="120,290 135,280 150,290 150,310 135,320 120,310" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="135" cy="300" r="3" fill="#38bdf8" filter="url(#glow)" />
  </g>
  <g class="data-particle p-delay-1" opacity="0.75">
    <polygon points="1020,80 1035,70 1050,80 1050,100 1035,110 1020,100" fill="rgba(168,85,247,0.2)" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="1035" cy="90" r="3" fill="#c084fc" filter="url(#glow)" />
  </g>
  <g class="data-particle p-delay-3" opacity="0.6">
    <circle cx="890" cy="320" r="5" fill="#38bdf8" filter="url(#glow)" />
    <line x1="890" y1="320" x2="940" y2="350" stroke="rgba(56,189,248,0.3)" stroke-width="1.5" />
    <circle cx="940" cy="350" r="3" fill="#a855f7" />
  </g>

  <!-- Foreground Content: Header & Titles (Always Crisp & Legible) -->
  <g id="foreground-content" transform="translate(80, 0)">
    
    <!-- Top Pill Badge -->
    <g transform="translate(0, 56)">
      <rect width="320" height="34" rx="17" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.2" />
      <circle cx="18" cy="17" r="5" fill="#10b981" filter="url(#glow)" />
      <text x="32" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.2">NEXT-GEN SECURITY OPERATIONS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.8">
      AI-Driven Security Operations Hub
    </text>

    <!-- Subtitle with Gradient Accent -->
    <text x="0" y="200" fill="url(#accent-cyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="21" font-weight="700" letter-spacing="0.2">
      ⚡ Agentic SOC Triage • LLM Investigation • Autonomous Defense
    </text>

    <!-- Tagline Description -->
    <text x="0" y="240" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="15" font-weight="400">
      Curated index of elite enterprise SaaS platforms, open-source AI SOC architectures, and detection tooling.
    </text>

    <!-- Feature Attribute Cards / Badges -->
    <g transform="translate(0, 276)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
        <text x="16" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🤖 Agentic Triage</text>
      </g>
      <!-- Card 2 -->
      <g transform="translate(196, 0)">
        <rect width="200" height="42" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.2" />
        <text x="16" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🛡️ Self-Hosted SIEM/EDR</text>
      </g>
      <!-- Card 3 -->
      <g transform="translate(412, 0)">
        <rect width="190" height="42" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(14, 165, 233, 0.35)" stroke-width="1.2" />
        <text x="16" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📜 Replayable Ledgers</text>
      </g>
      <!-- Card 4 -->
      <g transform="translate(618, 0)">
        <rect width="190" height="42" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(34, 197, 94, 0.35)" stroke-width="1.2" />
        <text x="16" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Autonomous SOAR</text>
      </g>
    </g>

    <!-- Bottom Metadata Line -->
    <g transform="translate(0, 360)">
      <circle cx="6" cy="6" r="4" fill="#38bdf8" />
      <text x="20" y="10" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
        Continuous Monitoring • MITRE ATT&amp;CK Mapped • Comprehensive Market Data
      </text>
    </g>

  </g>
</svg>
